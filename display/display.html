<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feeding Report - TV Display</title>
    <!--
      SOURCE FILE — do not deploy this file directly.
      The "// @@CONTRACT@@" marker below is replaced with shared/contract.js by
      scripts/publish_display.sh, which pushes the assembled page to the
      Fairytails123/frmdisplay Pages repo (the TV's URL). Opening this raw source
      in a browser will fail (FRM_CONTRACT undefined) — that is expected.

      History: reworked 2026-07-26 (phase 2 of the tablet+TV consolidation) from the
      original OneDrive Feedingreport_display.html: hardened fetch (12s abort),
      in-flight guards, offline detection + TV-readable staleness banner, single
      version source. Restyled 2026-08-05 to the Organic design system
      (design_handoff_feeding_board/designs/Feeding TV Display.dc.html) — all of the
      connection-health and refresh machinery above is unchanged.

      The organising idea: a car dashboard at night. A clean bowl is dim; a problem
      glows. Nothing competes for attention unless somebody has to act on it.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caprasimo:wght@400&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* neutral ramp */
            --color-neutral-100: #f9f4ed;
            --color-neutral-200: #eee7db;
            --color-neutral-300: #dcd3c4;
            --color-neutral-400: #c0b6a5;
            --color-neutral-500: #a19786;
            --color-neutral-600: #82796a;
            --color-neutral-700: #645c50;
            --color-neutral-800: #474238;
            --color-neutral-900: #2e2b25;

            /* terracotta ramp */
            --color-accent:     #c67139;
            --color-accent-100: #fff2eb;
            --color-accent-200: #ffe1d0;
            --color-accent-300: #ffc6a5;
            --color-accent-400: #f6a06b;
            --color-accent-500: #d67f48;
            --color-accent-600: #b2622d;
            --color-accent-700: #8c491a;
            --color-accent-800: #643312;
            --color-accent-900: #402310;

            /* sage ramp */
            --color-accent-2-200: #e1eecc;
            --color-accent-2-300: #ccdbb2;
            --color-accent-2-400: #aebf92;
            --color-accent-2-600: #728157;
            --color-accent-2-700: #56633f;
            --color-accent-2-800: #3d472b;
            --color-accent-2-900: #272e1b;

            /* dark ground */
            --tv-bg:         #201e1d;
            --tv-card:       #2e2b25;
            --tv-card-warn:  #332b23;   /* half */
            --tv-card-alert: #3a2a1c;   /* quarter */
            --tv-card-stop:  #402310;   /* none */

            --font-heading: "Caprasimo", Georgia, serif;
            --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: var(--tv-bg);
            color: var(--color-neutral-100);
            font-family: var(--font-body);
            -webkit-font-smoothing: antialiased;
        }

        /* Every size on this page is a multiple of --u, so one page reads identically
           on the 32" 1366x768 set, on 1080p and on 4K.
           --u is 1cqh (1% of the display's own height) where container query units
           exist, and falls back to 1vh where they do not. The TV browser is not ours
           to choose, and an unsupported unit would collapse the entire layout. */
        .tv-root { container-type: size; position: absolute; inset: 0; overflow: hidden; }
        .tv-page { --u: 1vh; }
        @supports (height: 1cqh) { .tv-page { --u: 1cqh; } }

        .tv-page {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            gap: calc(2 * var(--u));
            padding: calc(2.6 * var(--u)) calc(3 * var(--u)) calc(2.2 * var(--u));
            background: radial-gradient(125% 95% at 50% -12%, #2e2b25 0%, #201e1d 60%);
        }
        .tv-page.is-stale { padding-top: calc(11.5 * var(--u)); }

        @keyframes tvLamp    { 0%, 100% { opacity: 1 } 50% { opacity: .32 } }
        @keyframes tvBreathe { 0%, 100% { opacity: .45 } 50% { opacity: .95 } }
        @keyframes tvIn      { from { opacity: 0; transform: translateY(calc(.7 * var(--u))) } to { opacity: 1; transform: translateY(0) } }
        @keyframes tvAlarm {
            0%, 100% { box-shadow: 0 0 0 calc(.12 * var(--u)) #8c491a, 0 0 calc(2.2 * var(--u)) rgba(246, 160, 107, .30) }
            50%      { box-shadow: 0 0 0 calc(.12 * var(--u)) #b2622d, 0 0 calc(3.8 * var(--u)) rgba(246, 160, 107, .55) }
        }
        @keyframes tvSpin { to { transform: rotate(360deg) } }
        .tv-lamp    { animation: tvLamp 1.5s ease-in-out infinite; }
        .tv-breathe { animation: tvBreathe 3.4s ease-in-out infinite; }
        .tv-alarm   { animation: tvAlarm 2.6s ease-in-out infinite; }
        .tv-in      { animation: tvIn .45s cubic-bezier(.22,1,.36,1); }
        @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

        /* ---------------------------------------------------------- banner
           The stale board stays visible behind it on purpose: old data plus an
           explicit warning beats a blank screen. */
        .stale-banner {
            position: absolute;
            top: 0; left: 0; right: 0;
            z-index: 80;
            display: none;
            align-items: center;
            justify-content: center;
            gap: calc(2.4 * var(--u));
            padding: calc(1.8 * var(--u)) calc(3 * var(--u));
            background: linear-gradient(180deg, #643312 0%, #402310 100%);
            border-bottom: calc(.2 * var(--u)) solid var(--color-accent-500);
        }
        .stale-banner.visible { display: flex; }
        .stale-lamp {
            display: grid; place-items: center;
            width: calc(5.6 * var(--u)); height: calc(5.6 * var(--u));
            flex: none;
            border-radius: 99px;
            background: var(--color-accent-400);
            color: #402310;
        }
        .stale-title {
            font-family: var(--font-heading);
            font-size: calc(4.2 * var(--u));
            letter-spacing: .07em;
            color: var(--color-accent-200);
        }
        .stale-divider { width: calc(.15 * var(--u)); height: calc(4.6 * var(--u)); background: var(--color-accent-600); }
        .stale-text { font-size: calc(2.8 * var(--u)); font-weight: 600; color: var(--color-accent-300); }

        /* --------------------------------------------------- instrument cluster */
        .tv-header { flex: none; display: flex; align-items: center; gap: calc(3 * var(--u)); }
        .tv-brand { display: flex; align-items: center; gap: calc(1.8 * var(--u)); min-width: 0; }
        .tv-mark {
            display: grid; place-items: center;
            width: calc(6.6 * var(--u)); height: calc(6.6 * var(--u));
            flex: none;
            border-radius: 99px;
            background: var(--color-accent-2-800);
            color: var(--color-accent-2-300);
            border: calc(.15 * var(--u)) solid var(--color-accent-2-700);
        }
        .tv-eyebrow {
            font-size: calc(1.9 * var(--u));
            font-weight: 700;
            letter-spacing: .22em;
            text-transform: uppercase;
            color: var(--color-neutral-500);
        }
        .tv-meal { font-family: var(--font-heading); font-size: calc(5.3 * var(--u)); line-height: 1.02; }
        .tv-header-right { display: flex; flex-direction: column; align-items: flex-end; gap: calc(.8 * var(--u)); }
        .tv-clock { font-family: var(--font-heading); font-size: calc(4.8 * var(--u)); line-height: 1; }
        .tv-live {
            display: flex; align-items: center; gap: calc(1 * var(--u));
            padding: calc(.7 * var(--u)) calc(1.7 * var(--u));
            border-radius: 99px;
            background: var(--color-accent-2-900);
            border: calc(.15 * var(--u)) solid var(--color-accent-2-700);
        }
        .refresh-dot {
            width: calc(1.4 * var(--u)); height: calc(1.4 * var(--u));
            flex: none;
            border-radius: 99px;
            background: var(--color-accent-2-300);
            animation: tvBreathe 3.4s ease-in-out infinite;
        }
        .refresh-dot.syncing   { background: var(--color-accent-300); animation: tvLamp 1.2s ease-in-out infinite; }
        .refresh-dot.fast-mode { background: var(--color-accent-400); animation: tvLamp .8s ease-in-out infinite; }
        .refresh-dot.error     { background: var(--color-accent-300); animation: tvLamp 1.5s ease-in-out infinite; }
        .tv-live-label {
            font-size: calc(1.9 * var(--u));
            font-weight: 700;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: var(--color-accent-2-300);
            white-space: nowrap;
        }
        .tv-live.is-error { background: #402310; border-color: var(--color-accent-700); }
        .tv-live.is-error .tv-live-label { color: var(--color-accent-200); }

        /* ------------------------------------------------------------- pens */
        .pens-container { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: calc(1.8 * var(--u)); }
        .pen-section { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: calc(1 * var(--u)); }
        .pen-section-head { flex: none; display: flex; align-items: center; gap: calc(1.4 * var(--u)); }
        .pen-section-label {
            font-size: calc(1.9 * var(--u));
            font-weight: 700;
            letter-spacing: .2em;
            text-transform: uppercase;
            color: var(--color-neutral-500);
        }
        .pen-section-rule { flex: 1; height: calc(.15 * var(--u)); background: var(--color-neutral-800); }
        .pen-section-count { font-size: calc(1.9 * var(--u)); font-weight: 600; color: var(--color-neutral-600); }

        .pen-row {
            flex: 1; min-height: 0;
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: calc(1.6 * var(--u));
        }
        .pen {
            min-height: 0;
            display: flex; flex-direction: column;
            gap: calc(1 * var(--u));
            padding: calc(1.4 * var(--u));
            border-radius: calc(2.6 * var(--u));
            background: var(--tv-card);
            border: calc(.15 * var(--u)) solid var(--color-neutral-800);
            overflow: hidden;
        }
        /* A pen holding a refusal lights up as a whole, so it is findable from the doorway. */
        .pen.has-alert { background: #33261c; border-color: var(--color-accent-700); }
        .pen-header { flex: none; display: flex; align-items: center; gap: calc(.9 * var(--u)); }
        .pen-label {
            font-family: var(--font-heading);
            font-size: calc(3 * var(--u));
            line-height: 1;
            color: var(--color-neutral-400);
            flex: 1;
        }
        .pen.has-alert .pen-label { color: var(--color-accent-300); }
        .pen-alert {
            display: grid; place-items: center;
            width: calc(2.9 * var(--u)); height: calc(2.9 * var(--u));
            flex: none;
            border-radius: 99px;
            background: var(--color-accent-400);
            color: #402310;
        }
        .pen-count {
            display: grid; place-items: center;
            min-width: calc(3.4 * var(--u)); height: calc(2.9 * var(--u));
            padding: 0 calc(1 * var(--u));
            border-radius: 99px;
            background: var(--color-neutral-800);
            color: var(--color-neutral-300);
            font-size: calc(1.9 * var(--u));
            font-weight: 700;
        }
        .pen-count.is-zero { background: transparent; color: var(--color-neutral-700); }

        .pen-dogs { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: calc(var(--gap) * var(--u)); overflow: hidden; }
        .pen-empty {
            flex: 1;
            display: grid; place-items: center;
            border-radius: calc(1.6 * var(--u));
            border: calc(.15 * var(--u)) dashed var(--color-neutral-800);
            font-size: calc(2 * var(--u));
            color: var(--color-neutral-700);
        }

        .dog-card {
            flex: none;
            display: flex; align-items: center;
            gap: calc(1 * var(--u));
            padding: calc(var(--padv) * var(--u)) calc(var(--padh) * var(--u));
            border-radius: calc(1.6 * var(--u));
            background: var(--tv-card);
            border-left: calc(.7 * var(--u)) solid var(--color-accent-2-600);
        }
        .dog-name {
            flex: 1; min-width: 0;
            font-size: calc(var(--name) * var(--u));
            font-weight: 700;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            color: var(--color-neutral-300);
        }
        .dog-status {
            flex: none;
            text-align: right;
            min-width: calc(var(--sw) * var(--u));
            font-family: var(--font-heading);
            font-size: calc(var(--status) * var(--u));
            line-height: 1;
            color: var(--color-neutral-600);
        }
        .indicator {
            display: grid; place-items: center;
            width: calc(var(--chip) * var(--u)); height: calc(var(--chip) * var(--u));
            flex: none;
            border-radius: 99px;
            border: calc(.12 * var(--u)) solid transparent;
        }
        .indicator-p { background: var(--color-accent-800);   color: var(--color-accent-300);   border-color: var(--color-accent-700); }
        .indicator-s { background: var(--color-accent-2-800); color: var(--color-accent-2-300); border-color: var(--color-accent-2-700); }

        /* A clean bowl is dim. A problem glows. */
        .dog-card.status-all           { background: var(--tv-card);       border-left-color: var(--color-accent-2-600); }
        .dog-card.status-three-quarter { background: var(--tv-card);       border-left-color: var(--color-accent-2-400); }
        .dog-card.status-three-quarter .dog-name   { color: var(--color-neutral-200); }
        .dog-card.status-three-quarter .dog-status { color: var(--color-neutral-500); }
        .dog-card.status-half          { background: var(--tv-card-warn);  border-left-color: var(--color-accent-400); }
        .dog-card.status-half .dog-name   { color: var(--color-neutral-100); }
        .dog-card.status-half .dog-status { color: var(--color-accent-300); }
        .dog-card.status-quarter       { background: var(--tv-card-alert); border-left-color: var(--color-accent-300);
                                         box-shadow: 0 0 calc(2 * var(--u)) rgba(246, 160, 107, .26); }
        .dog-card.status-quarter .dog-name   { color: var(--color-accent-100); }
        .dog-card.status-quarter .dog-status { color: var(--color-accent-200); }
        .dog-card.status-none          { background: var(--tv-card-stop);  border-left-color: var(--color-accent-300); }
        .dog-card.status-none .dog-name   { color: var(--color-accent-100); }
        .dog-card.status-none .dog-status { color: var(--color-accent-200); }

        /* ----------------------------------------------------------- footer */
        .footer {
            flex: none;
            display: flex; align-items: center;
            gap: calc(3 * var(--u));
            padding-top: calc(1.6 * var(--u));
            border-top: calc(.15 * var(--u)) solid var(--color-neutral-800);
        }
        .legend { display: flex; align-items: center; gap: calc(1.7 * var(--u)); flex: none; white-space: nowrap; }
        .legend-item {
            display: flex; align-items: center; gap: calc(.8 * var(--u));
            font-size: calc(1.9 * var(--u)); font-weight: 600;
            color: var(--color-neutral-500);
        }
        .legend-item.is-hot { color: var(--color-accent-300); }
        .legend-dot { width: calc(1.5 * var(--u)); height: calc(1.5 * var(--u)); border-radius: 99px; flex: none; }
        .footer-spacer { flex: 1; }
        .stat { display: flex; align-items: baseline; gap: calc(.9 * var(--u)); flex: none; }
        .stat-value { font-family: var(--font-heading); font-size: calc(3.2 * var(--u)); line-height: 1; color: var(--color-neutral-200); }
        .stat-value.is-hot { color: var(--color-accent-300); }
        .stat-label {
            font-size: calc(1.9 * var(--u)); font-weight: 600;
            letter-spacing: .1em; text-transform: uppercase;
            color: var(--color-neutral-600);
        }

        /* -------------------------------------- scale tiers (busiest pen wins)
           The same five tiers the proven display used, re-expressed in --u so they
           hold on any panel instead of only the 32" set. */
        .scale-xl { --name: 3.7;  --status: 3.2;  --padv: 1.3;  --padh: 1.6;  --gap: 1.1;  --chip: 3.2; --sw: 6.6; }
        .scale-lg { --name: 3.1;  --status: 2.7;  --padv: 1;    --padh: 1.3;  --gap: .85;  --chip: 2.8; --sw: 5.8; }
        .scale-md { --name: 2.6;  --status: 2.3;  --padv: .8;   --padh: 1.1;  --gap: .7;   --chip: 2.5; --sw: 5; }
        .scale-sm { --name: 2.2;  --status: 2;    --padv: .6;   --padh: .9;   --gap: .55;  --chip: 2.1; --sw: 4.4; }
        .scale-xs { --name: 1.9;  --status: 1.75; --padv: .45;  --padh: .75;  --gap: .4;   --chip: 1.9; --sw: 3.8; }

        /* ---------------------------------------------------------- loading */
        .loading-overlay {
            position: absolute;
            inset: 0;
            z-index: 90;
            background: var(--tv-bg);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: calc(3.4 * var(--u));
            transition: opacity .5s ease;
        }
        .loading-overlay.hidden { opacity: 0; pointer-events: none; }
        .loading-mark {
            display: grid; place-items: center;
            width: calc(14 * var(--u)); height: calc(14 * var(--u));
            border-radius: 99px;
            border: calc(.3 * var(--u)) solid var(--color-accent-2-700);
            color: var(--color-accent-2-300);
        }
        .loading-text { font-family: var(--font-heading); font-size: calc(3.6 * var(--u)); color: var(--color-neutral-400); }
    </style>
</head>
<body>
    <div class="tv-root">
        <div class="tv-page scale-lg" id="tvContainer">

            <!-- Staleness / connection banner (hidden while confirmed live) -->
            <div class="stale-banner" id="staleBanner" role="alert">
                <span class="stale-lamp tv-lamp" aria-hidden="true">
                    <svg width="62%" height="62%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"><path d="M12 7.5v6.2"></path><path d="M12 17.4h.01"></path></svg>
                </span>
                <span class="stale-title">NOT LIVE</span>
                <span class="stale-divider"></span>
                <span class="stale-text" id="staleBannerText">Board as it stood earlier</span>
            </div>

            <!-- Loading overlay -->
            <div class="loading-overlay" id="loadingOverlay">
                <span class="loading-mark tv-breathe" aria-hidden="true">
                    <svg width="58%" height="58%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11h18"></path><path d="M4.5 11a7.5 7.5 0 0 0 15 0"></path><path d="M12 18.5V21"></path></svg>
                </span>
                <div class="loading-text">Waking the board…</div>
            </div>

            <!-- Instrument cluster -->
            <header class="tv-header">
                <div class="tv-brand">
                    <span class="tv-mark" aria-hidden="true">
                        <svg width="56%" height="56%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11h18"></path><path d="M4.5 11a7.5 7.5 0 0 0 15 0"></path><path d="M12 18.5V21"></path></svg>
                    </span>
                    <div>
                        <div class="tv-eyebrow">Fairy Tails · Feeding</div>
                        <div class="tv-meal" id="mealDisplay">Loading…</div>
                    </div>
                </div>
                <span class="footer-spacer"></span>
                <div class="tv-header-right">
                    <span class="tv-clock" id="tvClock">--:--</span>
                    <span class="tv-live" id="tvLive">
                        <span class="refresh-dot" id="refreshDot"></span>
                        <span class="tv-live-label" id="statusText">Connecting…</span>
                    </span>
                </div>
            </header>

            <!-- Pens -->
            <div class="pens-container" id="pensContainer"></div>

            <!-- Bottom readout -->
            <footer class="footer">
                <div class="legend" id="legend"></div>
                <span class="footer-spacer"></span>
                <span class="stat"><span class="stat-value" id="totalDogs">0</span><span class="stat-label">Dogs</span></span>
                <span class="stat"><span class="stat-value" id="pensUsed">0</span><span class="stat-label">Pens</span></span>
                <span class="stat"><span class="stat-value" id="needLook">0</span><span class="stat-label">Need a look</span></span>
                <span class="stat"><span class="stat-value" id="lastUpdate">--:--</span><span class="stat-label">Updated</span></span>
            </footer>
        </div>
    </div>

    <script>
// @@CONTRACT@@
    </script>
    <script>
        // ============================================
        // CONFIGURATION (display-local: presentation + cadence)
        // ============================================
        // Endpoint, pen scheme, status value set, fetch timeout and the position
        // sort all come from the injected FRM_CONTRACT block above — this file
        // must not define its own copies (scripts/check_contract.js enforces it).

        const VERSION_CHECK_INTERVAL = 10000; // normal mode: lightweight version probe
        const FAST_REFRESH_INTERVAL = 3000;   // fast mode: full reload cadence
        const FAST_MODE_DURATION = 30000;     // fast mode auto-reverts after this
        const STALE_AFTER_MS = 60000;         // banner when nothing confirmed for this long
        const OFFLINE_THRESHOLD = 2;          // consecutive failures before "connection lost"
        const BANNER_TICK_MS = 5000;          // staleness banner refresh cadence
        const CLOCK_TICK_MS = 20000;          // the TV sits on this page for days
        const REFRESH_MODE_NORMAL = 'normal';
        const REFRESH_MODE_FAST = 'fast';

        // Per-surface presentation of the contract's status VALUES (the tablet shows
        // ASCII fractions, the TV shows glyphs — only the value set is shared).
        const STATUS_LABELS = {
            'all': 'All',
            'three-quarter': '¾',
            'half': '½',
            'quarter': '¼',
            'none': 'None'
        };

        // Night-drive rule: a clean bowl is DIM, a problem GLOWS. `alarm` is what makes a
        // pen light its warning lamp; `hot` is what turns a legend entry terracotta.
        const STATUS_STYLE = {
            'all':           { dot: 'var(--color-accent-2-600)', glow: 'none', alarm: false, hot: false },
            'three-quarter': { dot: 'var(--color-accent-2-400)', glow: 'none', alarm: false, hot: false },
            'half':          { dot: 'var(--color-accent-400)',   glow: '0 0 calc(1.2 * var(--u)) rgba(246,160,107,.45)', alarm: false, hot: false },
            'quarter':       { dot: 'var(--color-accent-300)',   glow: '0 0 calc(1.4 * var(--u)) rgba(255,198,165,.55)', alarm: false, hot: true },
            'none':          { dot: '#ffc6a5',                   glow: '0 0 calc(1.6 * var(--u)) rgba(255,198,165,.75)', alarm: true,  hot: true }
        };

        const gasFetch = frmMakeGasFetch(FRM_CONTRACT.FETCH_TIMEOUT_MS);

        function esc(value) {
            return String(value === null || value === undefined ? '' : value)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function hhmm(dt) {
            const p = n => (n < 10 ? '0' : '') + n;
            return p(dt.getHours()) + ':' + p(dt.getMinutes());
        }

        // ============================================
        // STATE
        // ============================================

        let dogs = [];
        const pens = {};
        FRM_CONTRACT.PEN_ORDER.forEach(penId => { pens[penId] = []; });

        let currentMealType = 'Loading…';
        let isFirstLoad = true;

        // Change gating: advanced ONLY after a successful full load, so a failed
        // load is re-detected on the next version check instead of lost.
        let lastKnownVersion = 0;
        let lastKnownCount = -1;

        // Connection health
        let consecutiveFailures = 0;
        let lastSuccessAt = Date.now();   // last successful fetch of ANY kind (boot grace)

        // In-flight guards — slow responses must not stack overlapping requests
        // (the pre-2026-07-26 display had none and could apply out-of-order responses).
        let loadInFlight = false;
        let versionCheckInFlight = false;

        let currentRefreshMode = REFRESH_MODE_NORMAL;
        let refreshTimer = null;
        let versionCheckTimer = null;
        let fastModeTimer = null;

        // ============================================
        // INITIALIZATION
        // ============================================

        document.addEventListener('DOMContentLoaded', () => {
            renderPensStructure();
            renderLegend();
            updateClock();
            loadData();
            startAutoRefresh();
            setInterval(updateStaleBanner, BANNER_TICK_MS);
            setInterval(updateClock, CLOCK_TICK_MS);
        });

        function renderPensStructure() {
            const container = document.getElementById('pensContainer');
            const penCell = penId => {
                const label = penId.replace('-', ' ').replace(/\b\w/g, l => l.toUpperCase());
                return `
                    <div class="pen" id="pen-${penId}">
                        <div class="pen-header">
                            <span class="pen-label">${label}</span>
                            <span class="pen-alert tv-lamp" id="alert-${penId}" style="display:none" aria-hidden="true">
                                <svg width="64%" height="64%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round"><path d="M12 7v7"></path><path d="M12 17.8h.01"></path></svg>
                            </span>
                            <span class="pen-count is-zero" id="count-${penId}">0</span>
                        </div>
                        <div class="pen-dogs" id="dogs-${penId}"></div>
                    </div>
                `;
            };
            const top = FRM_CONTRACT.PEN_ORDER.filter(p => p.indexOf('top-') === 0);
            const bottom = FRM_CONTRACT.PEN_ORDER.filter(p => p.indexOf('bottom-') === 0);
            const section = (key, label, ids) => `
                <div class="pen-section">
                    <div class="pen-section-head">
                        <span class="pen-section-label">${label}</span>
                        <span class="pen-section-rule"></span>
                        <span class="pen-section-count" id="${key}Count">0 dogs</span>
                    </div>
                    <div class="pen-row" id="${key}PensRow">${ids.map(penCell).join('')}</div>
                </div>
            `;
            container.innerHTML = section('top', 'Top pens', top) + section('bottom', 'Bottom pens', bottom);
        }

        function renderLegend() {
            const el = document.getElementById('legend');
            if (!el) return;
            el.innerHTML = FRM_CONTRACT.STATUS_VALUES.map(v => {
                const s = STATUS_STYLE[v] || STATUS_STYLE.all;
                return `<span class="legend-item${s.hot ? ' is-hot' : ''}">` +
                       `<span class="legend-dot" style="background:${s.dot};box-shadow:${s.glow}"></span>` +
                       `${STATUS_LABELS[v] || v}</span>`;
            }).join('');
        }

        function updateClock() {
            const el = document.getElementById('tvClock');
            if (el) el.textContent = hhmm(new Date());
        }

        // ============================================
        // CONNECTION HEALTH
        // ============================================

        function noteSuccess() {
            consecutiveFailures = 0;
            lastSuccessAt = Date.now();
            updateStaleBanner();
            // ⚠️ Clearing the STATUS PILL here is load-bearing (fixed 2026-08-04).
            // Before this, only loadData()'s success path called setRefreshStatus('connected'),
            // and loadData only runs when the version CHANGES. So a single transient failure lit
            // "Connection error" and, on a quiet board, NOTHING ever turned it off — the probe
            // kept succeeding every 10s behind a permanently red dot. Staff on the TV had no way
            // to tell a real outage from a stale indicator, which is worse than no indicator.
            // A successful poll proves connectivity, so it must say so.
            setRefreshStatus('connected');
        }

        function noteFailure(message) {
            consecutiveFailures++;
            // A failed FIRST load must not leave the loading overlay up forever —
            // drop to the (empty) board + banner and keep retrying on the timers.
            if (isFirstLoad) {
                hideLoadingOverlay();
                isFirstLoad = false;
            }
            setRefreshStatus('error', message);
            updateStaleBanner();
        }

        function updateStaleBanner() {
            const banner = document.getElementById('staleBanner');
            const text = document.getElementById('staleBannerText');
            const page = document.getElementById('tvContainer');
            const disconnected = consecutiveFailures >= OFFLINE_THRESHOLD;
            const unconfirmedMs = Date.now() - lastSuccessAt;
            const stale = unconfirmedMs > STALE_AFTER_MS;

            if (!disconnected && !stale) {
                banner.classList.remove('visible');
                if (page) page.classList.remove('is-stale');
                return;
            }

            const ageMin = Math.round(unconfirmedMs / 60000);
            const ageText = ageMin < 1 ? 'moments ago' : ageMin + ' min ago';
            const asOf = hhmm(new Date(lastSuccessAt));
            text.textContent = (disconnected ? 'Connection lost — showing the board from ' : 'Board as it stood at ')
                + asOf + ' (' + ageText + ')';
            banner.classList.add('visible');
            if (page) page.classList.add('is-stale');
        }

        // ============================================
        // DATA LOADING
        // ============================================

        async function loadData() {
            if (loadInFlight) return;
            loadInFlight = true;
            setRefreshStatus('syncing');

            try {
                // @36: the live board lives in n8n, not Apps Script — see shared/contract.js.
                const response = await gasFetch(FRM_CONTRACT.SESSION_API_URL, {
                    method: 'POST',
                    redirect: 'follow',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'getSession' })
                });
                const result = await response.json();

                if (result && result.success) {
                    applyData(result);
                    if (typeof result.version === 'number') lastKnownVersion = result.version;
                    if (typeof result.count === 'number') lastKnownCount = result.count;
                    noteSuccess();
                    if (isFirstLoad) {
                        hideLoadingOverlay();
                        isFirstLoad = false;
                    }
                    setRefreshStatus('connected');
                } else {
                    noteFailure('Data error');
                }
            } catch (error) {
                console.error('Load error:', error);
                noteFailure('Connection error');
            } finally {
                loadInFlight = false;
            }
        }

        function applyData(result) {
            currentMealType = result.mealType || 'Lunch';
            document.getElementById('mealDisplay').textContent = currentMealType;

            dogs = result.dogs || [];

            for (const penId of FRM_CONTRACT.PEN_ORDER) {
                pens[penId] = [];
            }
            dogs.forEach(dog => {
                if (dog.penId && pens[dog.penId]) {
                    pens[dog.penId].push(dog);
                }
            });

            // Within-pen feeding order — same stable position sort as the tablet.
            for (const penId of FRM_CONTRACT.PEN_ORDER) {
                frmSortPenByPosition(pens[penId]);
            }

            // Scale BEFORE rendering: the tier drives the CSS custom properties every card
            // reads, so setting it after a render leaves one frame at the wrong size.
            calculateScale();
            renderAllPens();
            updateStats();
        }

        function renderAllPens() {
            for (const penId of FRM_CONTRACT.PEN_ORDER) {
                renderPen(penId);
            }
            const countIn = side => FRM_CONTRACT.PEN_ORDER
                .filter(p => p.indexOf(side + '-') === 0)
                .reduce((a, p) => a + pens[p].length, 0);
            const top = document.getElementById('topCount');
            const bottom = document.getElementById('bottomCount');
            if (top) top.textContent = countIn('top') + ' dogs';
            if (bottom) bottom.textContent = countIn('bottom') + ' dogs';
        }

        function renderPen(penId) {
            const container = document.getElementById(`dogs-${penId}`);
            const penEl = document.getElementById(`pen-${penId}`);
            const countEl = document.getElementById(`count-${penId}`);
            const alertEl = document.getElementById(`alert-${penId}`);
            const penDogs = pens[penId];

            const hasAlert = penDogs.some(d => (STATUS_STYLE[d.status] || {}).alarm);
            if (penEl) {
                if (hasAlert) penEl.classList.add('has-alert');
                else penEl.classList.remove('has-alert');
            }
            if (alertEl && alertEl.style) alertEl.style.display = hasAlert ? 'grid' : 'none';
            if (countEl) {
                countEl.textContent = penDogs.length;
                countEl.className = 'pen-count' + (penDogs.length ? '' : ' is-zero');
            }
            if (!container) return;

            if (penDogs.length === 0) {
                container.innerHTML = '<div class="pen-empty">Empty</div>';
                return;
            }

            container.innerHTML = penDogs.map(dog => {
                const displayName = dog.matchedName || dog.inputName || 'Unknown';
                const status = dog.status || 'all';
                const statusLabel = STATUS_LABELS[status] || status;
                const style = STATUS_STYLE[status] || STATUS_STYLE.all;

                let indicators = '';
                if (dog.prescription) {
                    indicators += '<span class="indicator indicator-p" title="Medicine">' +
                        '<svg width="60%" height="60%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round"><rect x="2.5" y="8.5" width="19" height="7" rx="3.5" transform="rotate(-45 12 12)"></rect><path d="M8.5 8.5 15.5 15.5"></path></svg></span>';
                }
                if (dog.supplements) {
                    indicators += '<span class="indicator indicator-s" title="Supplements">' +
                        '<svg width="60%" height="60%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4c0 9-5.5 13-11 13a5.5 5.5 0 0 1 0-11c5 0 8-1 11-2Z"></path><path d="M4 20c2-5 5-8 9-10"></path></svg></span>';
                }

                return `
                    <div class="dog-card status-${esc(status)} tv-in${style.alarm ? ' tv-alarm' : ''}">
                        <span class="dog-name">${esc(displayName)}</span>
                        ${indicators}
                        <span class="dog-status">${statusLabel}</span>
                    </div>
                `;
            }).join('');
        }

        function updateStats() {
            let totalDogs = 0;
            let pensUsed = 0;
            let needLook = 0;

            for (const penDogs of Object.values(pens)) {
                totalDogs += penDogs.length;
                if (penDogs.length > 0) pensUsed++;
                penDogs.forEach(d => {
                    const s = d.status || 'all';
                    // Refusals plus quarters — the only number anyone has to act on.
                    if (s === 'none' || s === 'quarter') needLook++;
                });
            }

            document.getElementById('totalDogs').textContent = totalDogs;
            document.getElementById('pensUsed').textContent = pensUsed;
            const nl = document.getElementById('needLook');
            if (nl) {
                nl.textContent = needLook;
                nl.className = 'stat-value' + (needLook ? ' is-hot' : '');
            }
            document.getElementById('lastUpdate').textContent = hhmm(new Date());
        }

        // ============================================
        // DYNAMIC SCALING
        // ============================================

        function calculateScale() {
            const container = document.getElementById('tvContainer');
            ['scale-xl', 'scale-lg', 'scale-md', 'scale-sm', 'scale-xs']
                .forEach(c => container.classList.remove(c));

            let maxDogsInPen = 0;
            for (const penDogs of Object.values(pens)) {
                if (penDogs.length > maxDogsInPen) {
                    maxDogsInPen = penDogs.length;
                }
            }

            let scaleClass;
            if (maxDogsInPen <= 2) {
                scaleClass = 'scale-xl';
            } else if (maxDogsInPen <= 3) {
                scaleClass = 'scale-lg';
            } else if (maxDogsInPen <= 4) {
                scaleClass = 'scale-md';
            } else if (maxDogsInPen <= 6) {
                scaleClass = 'scale-sm';
            } else {
                scaleClass = 'scale-xs';
            }

            container.classList.add(scaleClass);
        }

        // ============================================
        // AUTO REFRESH (adaptive, version-gated)
        // ============================================
        // Normal mode: getSessionVersion every 10s. On a confirmed change: full
        // load + fast mode (version probe every 3s) for 30s, then revert.
        // Since backend @29 both endpoints serve the SAME stored version, so an
        // idle board stays in normal mode (pre-@29 the mismatched version sources
        // kept this loop permanently in fast mode).
        // On failure: count it (banner) but do NOT fall back to full loads — the
        // old display polled HARDER during outages.

        function startAutoRefresh() {
            if (refreshTimer) clearInterval(refreshTimer);
            if (versionCheckTimer) clearInterval(versionCheckTimer);
            if (fastModeTimer) clearTimeout(fastModeTimer);

            currentRefreshMode = REFRESH_MODE_NORMAL;
            startVersionPolling();

            console.log('[Adaptive Refresh] Started in normal mode — version check every ' + (VERSION_CHECK_INTERVAL / 1000) + 's');
        }

        function startVersionPolling() {
            if (versionCheckTimer) clearInterval(versionCheckTimer);
            if (refreshTimer) clearInterval(refreshTimer);

            versionCheckTimer = setInterval(() => {
                checkForVersionChange();
            }, VERSION_CHECK_INTERVAL);
        }

        async function checkForVersionChange() {
            if (versionCheckInFlight || loadInFlight) return;
            versionCheckInFlight = true;

            try {
                // @36: version probe also goes to n8n — both endpoints MUST serve the same
                // stored version or this change gate can never settle (the @29 lesson).
                const response = await gasFetch(FRM_CONTRACT.SESSION_API_URL, {
                    method: 'POST',
                    redirect: 'follow',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'getSessionVersion' })
                });
                const result = await response.json();

                if (result && result.success) {
                    const versionChanged = result.version !== lastKnownVersion;
                    const countChanged = result.count !== lastKnownCount;

                    if (versionChanged || countChanged) {
                        console.log('[Adaptive Refresh] Data change detected! Version: ' + lastKnownVersion + ' → ' + result.version + ', Count: ' + lastKnownCount + ' → ' + result.count);
                        // Deliberately NO noteSuccess here: this probe just proved the
                        // board is STALE — only the successful full load confirms live
                        // (otherwise a failing getSession behind a healthy version
                        // probe would flap the banner and reset its timestamp).
                        // lastKnownVersion/Count advance only when the full load
                        // SUCCEEDS — a failed load re-detects on the next check.
                        loadData();
                        switchToFastMode();
                    } else {
                        // Board unchanged AND the probe answered — connectivity is confirmed.
                        noteSuccess();
                    }
                } else {
                    // Pre-2026-07-26 this case was silently swallowed (dot stayed
                    // green while the board went stale). Count it.
                    noteFailure('Data error');
                }
            } catch (error) {
                console.error('[Adaptive Refresh] Version check error:', error);
                noteFailure('Connection error');
            } finally {
                versionCheckInFlight = false;
            }
        }

        function switchToFastMode() {
            if (currentRefreshMode === REFRESH_MODE_FAST) {
                if (fastModeTimer) clearTimeout(fastModeTimer);
                console.log('[Adaptive Refresh] Fast mode extended — resetting timeout');
            } else {
                currentRefreshMode = REFRESH_MODE_FAST;

                if (versionCheckTimer) clearInterval(versionCheckTimer);
                versionCheckTimer = null;

                if (refreshTimer) clearInterval(refreshTimer);
                // Fast mode probes the VERSION, it does not blindly reload. The full read still
                // happens the instant something changes (checkForVersionChange -> loadData), so
                // the TV is no slower — but a busy-but-unchanged board no longer costs a full
                // getSession every 3s. lastKnownVersion only advances on a SUCCESSFUL load, so a
                // failed load is simply re-detected on the next probe.
                refreshTimer = setInterval(() => {
                    checkForVersionChange();
                }, FAST_REFRESH_INTERVAL);

                console.log('[Adaptive Refresh] ⚡ Switched to FAST mode — version check every ' + (FAST_REFRESH_INTERVAL / 1000) + 's');
            }

            updateRefreshModeDisplay();

            fastModeTimer = setTimeout(() => {
                switchToNormalMode();
            }, FAST_MODE_DURATION);
        }

        function switchToNormalMode() {
            currentRefreshMode = REFRESH_MODE_NORMAL;

            if (refreshTimer) clearInterval(refreshTimer);
            refreshTimer = null;

            if (fastModeTimer) clearTimeout(fastModeTimer);
            fastModeTimer = null;

            startVersionPolling();
            updateRefreshModeDisplay();

            console.log('[Adaptive Refresh] 🔄 Reverted to NORMAL mode — version check every ' + (VERSION_CHECK_INTERVAL / 1000) + 's');
        }

        function updateRefreshModeDisplay() {
            const text = document.getElementById('statusText');
            const dot = document.getElementById('refreshDot');
            const live = document.getElementById('tvLive');

            dot.className = 'refresh-dot';
            if (live) live.classList.remove('is-error');

            if (currentRefreshMode === REFRESH_MODE_FAST) {
                text.textContent = 'Live · fast';
                dot.classList.add('fast-mode');
            } else {
                text.textContent = 'Live';
            }
        }

        function setRefreshStatus(status, message = null) {
            const dot = document.getElementById('refreshDot');
            const text = document.getElementById('statusText');
            const live = document.getElementById('tvLive');

            dot.className = 'refresh-dot';

            switch (status) {
                case 'syncing':
                    if (live) live.classList.remove('is-error');
                    dot.classList.add('syncing');
                    text.textContent = 'Refreshing…';
                    break;
                case 'connected':
                    updateRefreshModeDisplay();
                    break;
                case 'error':
                    if (live) live.classList.add('is-error');
                    dot.classList.add('error');
                    text.textContent = message || 'Error';
                    break;
            }
        }

        function hideLoadingOverlay() {
            const overlay = document.getElementById('loadingOverlay');
            overlay.classList.add('hidden');
            setTimeout(() => {
                overlay.style.display = 'none';
            }, 500);
        }
    </script>
</body>
</html>
